<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 600" role="img" aria-label="Converter station with physical components, model terminals and directed powers"><title>Converter station with physical components, model terminals and directed powers</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#182f40"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="35" y="36" text-anchor="start" fill="#182f40" font-family="Arial,sans-serif" font-size="23" font-weight="bold">One station, three AC terminals, two different power-control ports</text><path d="M52 220H108" fill="none" stroke="#182f40" stroke-width="7" stroke-dasharray=""/><text x="80" y="203" text-anchor="middle" fill="#182f40" font-family="Arial,sans-serif" font-size="18" font-weight="bold">PCC s</text><text x="80" y="268" text-anchor="middle" fill="#182f40" font-family="Arial,sans-serif" font-size="20" font-weight="normal">Uₛ ∠δₛ</text><path d="M108 220H260" fill="none" stroke="#182f40" stroke-width="2" stroke-dasharray=""/><circle cx="210" cy="220" r="25" fill="white" stroke="#182f40" stroke-width="2"/><circle cx="235" cy="220" r="25" fill="white" stroke="#182f40" stroke-width="2"/><text x="225" y="160" text-anchor="middle" fill="#182f40" font-family="Arial,sans-serif" font-size="17" font-weight="normal">Transformer Zₜ</text><path d="M260 220H410" fill="none" stroke="#182f40" stroke-width="2" stroke-dasharray=""/><circle cx="410" cy="220" r="5" fill="#182f40" stroke="#182f40" stroke-width="2"/><text x="410" y="175" text-anchor="middle" fill="#182f40" font-family="Arial,sans-serif" font-size="18" font-weight="normal">Filter terminal f</text><text x="410" y="268" text-anchor="middle" fill="#182f40" font-family="Arial,sans-serif" font-size="20" font-weight="normal">U𝒇 ∠δ𝒇</text><path d="M410 220H605" fill="none" stroke="#182f40" stroke-width="2" stroke-dasharray=""/><rect x=