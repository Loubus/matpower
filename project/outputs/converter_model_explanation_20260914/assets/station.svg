middle" fill="#182f40" font-family="Arial,sans-serif" font-size="16" font-weight="normal">+ scalar active loss</text><path d="M410 220V320M386 320H434M386 332H434M410 332V365M390 365H430M396 373H424M402 381H418" fill="none" stroke="#182f40" stroke-width="2" stroke-dasharray=""/><text x="470" y="350" text-anchor="start" fill="#182f40" font-family="Arial,sans-serif" font-size="16" font-weight="normal">Y𝒇 = G𝒇+jB𝒇</text><text x="470" y="373" text-anchor="start" fill="#182f40" font-family="Arial,sans-serif" font-size="16" font-weight="normal">B𝒇=0 in this project</text><path d="M170 115H105" fill="none" stroke="#182f40" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="120" y="92" text-anchor="middle" fill="#182f40" font-family="Arial,sans-serif" font-size="17" font-weight="normal">Iₛ, Sₛ=Pₛ+jQₛ</text><path d="M685 115H610" fill="none" stroke="#182f40" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="648" y="92" text-anchor="middle" fill="#182f40" font-family="Arial,sans-serif" font-size="17" font-weight="normal">I𝒄, S𝒄=P𝒄+jQ𝒄</text><path d="M974 115H1050" fill="none" stroke="#182f40" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="1008" y="92" text-anchor="middle" fill="#182f40" font-family="Arial,sans-serif" font-size="17" font-weight="normal">I𝒅𝒄, P𝒅𝒄</text><rect x="30" y="430" width="325" height="128" fill="#f2f6fa" stroke="#176a98" stroke-width="1.5" stroke-dasharray="6 4"/><text x="48" y="459" text-anchor="start" fill="#182f40" font-family="Arial,sans-serif" font-size="18" font-weight="bold">PCC control port in Beerten</text><text x="48" y="489" text-anchor="start" fill="#182f40" font-family="Arial,sans-serif" font-size="15" font-weight="normal">Pₛ* and Qₛ*: delivered to AC grid</text><text x="48" y="511" text-anchor="start" fill="#182f40" font-family="Arial,sans-serif" font-size="15" font-weight="normal">VAC_SET also measures this voltage</text><text x="48" y="533" text-anchor="start" fill="#182f40" font-family="Arial,sans-serif" font-size="15" font-weight="normal">PCC power = − transformer PF/QF</text><rect x="385" y="430" width="335" height="128" fill="#f2f6fa" stroke="#176a98" stroke-width="1.5" stroke-dasharray="6 4"/><text x="403" y="459" text-anchor="start" fill="#182f40" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Auxiliary computational buses</text><text x="403" y="489" text-anchor="start" fill="#182f40" font-family="Arial,sans-serif" font-size="15" font-weight="normal">C1: 8 / 9; C2: 10 / 11; C3: 12 / 13</text><text x="403" y="511" text-anchor="start" fill="#182f40" font-family="Arial,sans-serif" font-size="15" font-weight="normal">They expose physical terminal voltages.</text><text x="403" y="533" text-anchor="start" fill="#182f40" font-family="Arial,sans-serif" font-size="15" font-weight="normal">They are not extra substations.</text><rect x="750" y="430" width="360" height="128" fill="#f2f6fa" stroke="#176a98" stroke-width="1.5" stroke-dasharray="6 4"/><text x="768" y="459" text-anchor="start" fill="#182f40" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Implemented power-control port</text><text x="768" y="489" text-anchor="start" fill="#182f40" font-family="Arial,sans-serif" font-size="15" font-weight="normal">PAC_SET = P𝒄*; QAC_SET = Q𝒄*</text><text x="768" y="511" text-anchor="start" fill="#182f40" font-family="Arial,sans-serif" font-size="15" font-weight="normal">P𝒄 + P𝒅𝒄 + P_loss = 0</text><text x="768" y="533" text-anchor="start" fill="#182f40" font-family="Arial,sans-serif" font-size="15" font-weight="normal">Proxy generator ≠ synchronous machine</text></svg>