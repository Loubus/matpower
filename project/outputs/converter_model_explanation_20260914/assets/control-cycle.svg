<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 300" role="img" aria-label="Steady-state voltage control to reactive-power limiting transition"><title>Steady-state voltage control to reactive-power limiting transition</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#182f40"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="20" y="65" width="335" height="126" fill="#edf4f8" stroke="#182f40" stroke-width="1.5" stroke-dasharray=""/><text x="187" y="94" text-anchor="middle" fill="#182f40" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Solve full AC/DC equations</text><text x="187" y="132" text-anchor="middle" fill="#182f40" font-family="Arial,sans-serif" font-size="15" font-weight="normal">V/PV: enforce PCC voltage</text><text x="187" y="154" text-anchor="middle" fill="#182f40" font-family="Arial,sans-serif" font-size="15" font-weight="normal">Internal Q is an unknown</text><rect x="385" y="65" width="335" height="126" fill="#edf4f8" stroke="#182f40" stroke-width="1.5" stroke-dasharray=""/><text x="552" y="94" text-anchor="middle" fill="#182f40" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Check capability at solved point</text><text x="552" y="132" text-anchor="middle" fill="#182f40" font-family="Arial,sans-serif" font-size="15" font-weight="normal">Select a P/Q projection</text><text x="552" y="154" text-anchor="middle" fill="#182f40" font-family="Arial,sans-serif" font-size="15" font-weight="normal">Change AC control mode if binding</text><rect x="750" y="65" width="335" height="126" fill="#edf4f8" stroke="#182f40" stroke-width="1.5" stroke-dasharray=""/><text x="917" y="94" text-anchor="middle" fill="#182f40" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Re-solve and settle controls</text><text x="917" y="132" text-anchor="middle" fill="#182f40" font-family="Arial,sans-serif" font-size="15" font-weight="normal">Recheck converter and generator limits</text><text x="917" y="154" text-anchor="middle" fill="#182f40" font-family="Arial,sans-serif" font-size="15" font-weight="normal">Recheck taps / shunts at full voltage</text><path d="M355 128H383" fill="none" stroke="#182f40" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M720 128H748" fill="none" stroke="#182f40" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M917 192V226H185V194" fill="none" stroke="#182f40" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="560" y="269" text-anchor="middle" fill="#182f40" font-family="Arial,sans-serif" font-size="16" font-weight="normal">Accept only a converged, settled point. Binding is a mode change; a failed re-correction is a separate outcome.</text></svg>