<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img"><title>Coordinating all controllers through the full electrical solution</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#486275"/></marker></defs><rect width="1200" height="610" fill="white"/><rect x="400" y="235" width="400" height="135" rx="8" fill="#e8f5ef" stroke="#a9bdc9"/><text x="600.0" y="264" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#18384d" text-anchor="middle" font-weight="600">Shared AC/DC station solution</text><text x="600.0" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">Voltages, currents, P/Q, losses and</text><text x="600.0" y="314" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">loading</text><rect x="30" y="50" width="310" height="125" rx="8" fill="#eef5f9" stroke="#a9bdc9"/><text x="185.0" y="79" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#18384d" text-anchor="middle" font-weight="600">Generator capability</text><text x="185.0" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">PV voltage control OR Q</text><text x="185.0" y="129" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">boundary</text><rect x="860" y="50" width="310" height="125" rx="8" fill="#eef5f9" stroke="#a9bdc9"/><text x="1015.0" y="79" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#18384d" text-anchor="middle" font-weight="600">Converter capability</text><text x="1015.0" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">AC request OR current/voltage</text><text x="1015.0" y="129" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">limit; keep DC duty</text><rect x="30" y="420" width="310" height="125" rx="8" fill="#eef5f9" stroke="#a9bdc9"/><text x="185.0" y="449" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#18384d" text-anchor="middle" font-weight="600">ULTC discrete position</text><text x="185.0" y="476" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">Finite tap grid; evaluate the</text><text x="185.0" y="499" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">controlled bus voltage</text><rect x="860" y="420" width="310" height="125" rx="8" fill="#eef5f9" stroke="#a9bdc9"/><text x="1015.0" y="449" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#18384d" text-anchor="middle" font-weight="600">Switched shunt</text><text x="1015.0" y="476" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">Finite B states; output Q</text><text x="1015.0" y="499" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">changes with voltage</text><path d="M340,160 L432,229" fill="none" stroke="#486275" stroke-width="2" marker-end="url(#arrow)"/><path d="M768,229 L862,160" fill="none" stroke="#486275" stroke-width="2" marker-end="url(#arrow)"/><path d="M860,122 L801,251" fill="none" stroke="#486275" stroke-width="2" marker-end="url(#arrow)"/><path d="M401,325 L340,452" fill="none" stroke="#486275" stroke-width="2" marker-end="url(#arrow)"/><path d="M340,488 L399,346" fill="none" stroke="#486275" stroke-width="2" marker-end="url(#arrow)"/><path d="M801,345 L860,455" fill="none" stroke="#486275" stroke-width="2" marker-end="url(#arrow)"/><path d="M860,489 L801,363" fill="none" stroke="#486275" stroke-width="2" marker-end="url(#arrow)"/><path d="M430,229 L338,113" fill="none" stroke="#486275" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#18384d" text-anchor="middle" font-weight="600">ONE TRIAL → ONE CONSISTENT ACTIVE SET</text><text x="600" y="124" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">Locate events → update equations → re-solve</text><text x="600" y="148" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">Recheck all devices before accepting</text><text x="600" y="460" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#18384d" text-anchor="middle" font-weight="600">Rejected trial: restore the entire snapshot</text><text x="600" y="489" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">Accepted trial: store state, modes and event IDs</text><text x="30" y="589" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#536775" text-anchor="start" font-weight="400">Design schematic. Physical saturation is allowed only under the declared study policy.</text></svg>