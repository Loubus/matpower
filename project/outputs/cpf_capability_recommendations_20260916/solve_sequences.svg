de</text><text x="165.0" y="411" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">Normal control OR the</text><text x="165.0" y="434" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">binding physical limit</text><rect x="360" y="355" width="480" height="140" rx="8" fill="#e8f5ef" stroke="#a9bdc9"/><text x="600.0" y="384" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#18384d" text-anchor="middle" font-weight="600">One coupled Newton / CPF system</text><text x="600.0" y="411" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">AC + DC + station + losses + selected limit</text><text x="600.0" y="434" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">equation</text><rect x="900" y="355" width="270" height="140" rx="8" fill="#eef5f9" stroke="#a9bdc9"/><text x="1035.0" y="384" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#18384d" text-anchor="middle" font-weight="600">Audit and accept</text><text x="1035.0" y="411" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">Every limit and discrete</text><text x="1035.0" y="434" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">control checks the same</text><text x="1035.0" y="457" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">state</text><path d="M300,425 L354,425" fill="none" stroke="#486275" stroke-width="2" marker-end="url(#arrow)"/><path d="M840,425 L894,425" fill="none" stroke="#486275" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="541" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#536775" text-anchor="start" font-weight="400">Design schematic. Existing solver code is unchanged.</text></svg>