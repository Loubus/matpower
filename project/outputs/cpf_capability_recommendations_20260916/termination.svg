<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img"><title>Separate electrical convergence, control acceptance, and completion</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#486275"/></marker></defs><rect width="1200" height="560" fill="white"/><rect x="25" y="80" width="250" height="150" rx="8" fill="#eef5f9" stroke="#a9bdc9"/><text x="150.0" y="109" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#18384d" text-anchor="middle" font-weight="600">Electrical equations</text><text x="150.0" y="136" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">Residuals and voltages</text><text x="150.0" y="159" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">finite?</text><rect x="325" y="80" width="250" height="150" rx="8" fill="#eef5f9" stroke="#a9bdc9"/><text x="450.0" y="109" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#18384d" text-anchor="middle" font-weight="600">Controls and limits</text><text x="450.0" y="136" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">Active equalities, other</text><text x="450.0" y="159" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">limits and discrete state</text><text x="450.0" y="182" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">pass?</text><rect x="625" y="80" width="250" height="150" rx="8" fill="#eef5f9" stroke="#a9bdc9"/><text x="750.0" y="109" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#18384d" text-anchor="middle" font-weight="600">Record curve events</text><text x="750.0" y="136" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">Crossings, tangent sign</text><text x="750.0" y="159" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">change, trial versus</text><text x="750.0" y="182" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">accepted</text><rect x="925" y="80" width="250" height="150" rx="8" fill="#eef5f9" stroke="#a9bdc9"/><text x="1050.0" y="109" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#18384d" text-anchor="middle" font-weight="600">Endpoint decision</text><text x="1050.0" y="136" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">FULL complete, NOSE stop,</text><text x="1050.0" y="159" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">or continue?</text><path d="M275,157 L318,157" fill="none" stroke="#486275" stroke-width="2" marker-end="url(#arrow)"/><path d="M575,157 L618,157" fill="none" stroke="#486275" stroke-width="2" marker-end="url(#arrow)"/><path d="M875,157 L918,157" fill="none" stroke="#486275" stroke-width="2" marker-end="url(#arrow)"/><path d="M150,230 L150,312" fill="none" stroke="#486275" stroke-width="2" marker-end="url(#arrow)"/><path d="M450,230 L450,312" fill="none" stroke="#486275" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="320" width="250" height="142" rx="8" fill="#fff4e7" stroke="#a9bdc9"/><text x="150.0" y="349" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#18384d" text-anchor="middle" font-weight="600">Numerical failure</text><text x="150.0" y="376" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">Record inner residual,</text><text x="150.0" y="399" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">iterations, step and</text><text x="150.0" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">attempted order</text><rect x="325" y="320" width="250" height="142" rx="8" fill="#fff4e7" stroke="#a9bdc9"/><text x="450.0" y="349" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#18384d" text-anchor="middle" font-weight="600">Control failure / bound</text><text x="450.0" y="376" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">Distinguish physical</text><text x="450.0" y="399" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">exhaustion, unresolved</text><text x="450.0" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">controls and cycles</text><rect x="625" y="320" width="550" height="142" rx="8" fill="#e8f5ef" stroke="#a9bdc9"/><text x="900.0" y="349" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#18384d" text-anchor="middle" font-weight="600">An event is not necessarily a stop</text><text x="900.0" y="376" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">Record a turn in both modes.</text><text x="900.0" y="399" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18384d" text-anchor="middle" font-weight="400">NOSE may stop; FULL can continue.</text><path d="M750,230 L750,313" fill="none" stroke="#486275" stroke-width="2" marker-end="url(#arrow)"/><path d="M1050,230 L1050,313" fill="none" stroke="#486275" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#18384d" text-anchor="start" font-weight="600">PROPOSED REPORTING: KEEP THESE QUESTIONS SEPARATE</text><text x="30" y="511" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#18384d" text-anchor="start" font-weight="600">Preserve the last accepted state even when the next candidate fails.</text><text x="30" y="543" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#536775" text-anchor="start" font-weight="400">A solver success flag alone is not evidence of a validated physical maximum.</text></svg>